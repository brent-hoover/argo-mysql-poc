apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-mysql-ops-templates
  namespace: argo
data:
  # Define parameterized templates for common operations
  # Each template has a predefined SQL query with placeholders
  
  # User operations
  delete-user: |
    DELETE FROM users WHERE id = :user_id;
  
  get-user: |
    SELECT * FROM users WHERE id = :user_id;
  
  update-user-status: |
    UPDATE users SET status = :status WHERE id = :user_id;
  
  # Organization operations
  get-org-users: |
    SELECT u.* FROM users u
    JOIN organization_members om ON u.id = om.user_id
    WHERE om.organization_id = :org_id;
  
  # Application operations
  backup-application-data: |
    SELECT * FROM application_data WHERE app_id = :app_id;
  
  # Audit operations
  get-user-activity: |
    SELECT * FROM audit_log WHERE user_id = :user_id AND action_date > :start_date;