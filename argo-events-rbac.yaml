apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-workflow-sa
  namespace: argo-events
---
# in order for the sensor to be able to create workflows in the argo namespace,
# we need to give it the ability to do so
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operate-workflow-role
rules:
  # Allow sensor to create workflows
  - apiGroups:
    - argoproj.io
    resources:
    - workflows
    verbs:
    - create
    - get
    - list
    - watch
    - update
    - patch
    - delete
  # Allow sensor to read workflowtemplates
  - apiGroups:
    - argoproj.io
    resources:
    - workflowtemplates
    verbs:
    - get
    - list
    - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operate-workflow-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operate-workflow-role
subjects:
  - kind: ServiceAccount
    name: operate-workflow-sa
    namespace: argo-events
---
# Service account for Redis eventbus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: argo-events